services:
  postgres:
    image: postgres:17-alpine
    container_name: witw-postgres-dev
    restart: unless-stopped
    labels:
      logging: enabled
      service: postgres
      env: dev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: witw_dev
      POSTGRES_USER: witw_dev
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?DEV_POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/witw_dev?sslmode=disable
      DATA_SOURCE_USER: witw_dev
      DATA_SOURCE_PASS: ${DEV_POSTGRES_PASSWORD:?DEV_POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8-alpine
    container_name: witw-valkey-dev
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: witw-backend-dev
    restart: unless-stopped
    # Kafka metadata가 반환하는 외부 hostname을 BigData EC2 사설 IP로 해석한다.
    extra_hosts:
      - "j15d203a.p.ssafy.io:172.26.11.46"
    labels:
      logging: enabled
      service: be
      env: dev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      SPRING_PROFILES_ACTIVE: dev-prod
      POSTGRESQL_URL: jdbc:postgresql://postgres:5432/witw_dev
      POSTGRESQL_USER: witw_dev
      POSTGRESQL_PASSWORD: ${DEV_POSTGRES_PASSWORD:?DEV_POSTGRES_PASSWORD is required}
      VALKEY_HOST: valkey
      VALKEY_HOST_PORT: "6379"
      VALKEY_PASSWORD: ""
      CORS_ALLOWED_ORIGIN: https://dev.witw.kro.kr
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:?MAIL_APP_PASSWORD is required}
      SSAFY_CLIENT_ID: ${SSAFY_CLIENT_ID:?SSAFY_CLIENT_ID is required}
      SSAFY_CLIENT_SECRET: ${SSAFY_CLIENT_SECRET:?SSAFY_CLIENT_SECRET is required}
      SSAFY_REDIRECT_URI: ${SSAFY_REDIRECT_URI:?SSAFY_REDIRECT_URI is required}
      GMS_API_KEY: ${GMS_API_KEY:?GMS_API_KEY is required}
      NOTIFICATION_SCHEDULER_ENABLED: ${NOTIFICATION_SCHEDULER_ENABLED:-false}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  postgres-data:
    name: witw-dev-postgres-data
  valkey-data:
    name: witw-dev-valkey-data

networks:
  default:
    name: witw-dev-network
    external: true
