services:
  postgres:
    image: postgres:17-alpine
    container_name: witw-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: witw_dev
      POSTGRES_USER: witw_dev
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?DEV_POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: witw-valkey-dev
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: witw-backend-dev
    restart: unless-stopped
    # Kafka metadata가 반환하는 외부 hostname을 BigData EC2 사설 IP로 해석한다.
    extra_hosts:
      - "j15d203a.p.ssafy.io:172.26.11.46"
    labels:
      logging: enabled
      service: be
      env: dev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      SPRING_PROFILES_ACTIVE: dev-prod
      POSTGRESQL_URL: jdbc:postgresql://postgres:5432/witw_dev
      POSTGRESQL_USER: witw_dev
      POSTGRESQL_PASSWORD: ${DEV_POSTGRES_PASSWORD:?DEV_POSTGRES_PASSWORD is required}
      VALKEY_HOST: valkey
      VALKEY_HOST_PORT: "6379"
      VALKEY_PASSWORD: ""
      CORS_ALLOWED_ORIGIN: https://dev.witw.kro.kr
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  postgres-data:
    name: witw-dev-postgres-data
  valkey-data:
    name: witw-dev-valkey-data

networks:
  default:
    name: witw-dev-network
    external: true
