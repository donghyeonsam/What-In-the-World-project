spring:
  application:
    name: witw
  flyway:
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  profiles:
    default: dev
  session:
    store-type: redis
    redis:
      namespace: spring:session
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
springdoc:
  paths-to-match: /api/v1/**
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 1d
      cookie:
        http-only: true
        same-site: lax
