spring:
  application:
    name: witw
  flyway:
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  profiles:
    default: dev
  session:
    store-type: redis
    redis:
      namespace: spring:session
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
springdoc:
  paths-to-match: /api/v1/**
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
analysis:
  # 글로벌 이슈 목록과 국가별 분석 대상에 동일하게 적용됩니다. 7 또는 10으로 변경할 수 있습니다.
  top-issue-limit: 5
  min-country-articles: 10
  scheduler:
    enabled: true
    # 매시 정각: 0 0 * * * * / 3시간마다 정각: 0 0 */3 * * * (Asia/Seoul)
    cron: "0 0 * * * *"
server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 1d
      cookie:
        http-only: true
        same-site: lax

ssafy:
  oauth:
    client-id: ${SSAFY_CLIENT_ID:}
    client-secret: ${SSAFY_CLIENT_SECRET:}
    redirect-uri: ${SSAFY_REDIRECT_URI:}
    token-uri: https://project.ssafy.com/ssafy/oauth2/token
    user-info-uri: https://project.ssafy.com/ssafy/resources/userInfo