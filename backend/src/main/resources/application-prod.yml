management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${POSTGRESQL_URL:jdbc:postgresql://localhost:5432/witw}
    username: ${POSTGRESQL_USER:postgres}
    password: ${POSTGRESQL_PASSWORD:1234}
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_HOST_PORT:6379}
      password: ${VALKEY_PASSWORD:}
  kafka:
    bootstrap-servers: 172.26.11.46:19092
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:db-writer-prod-v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
server:
  servlet:
    session:
      cookie:
        secure: false

app:
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
