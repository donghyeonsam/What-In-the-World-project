services:
  postgres:
    image: postgres:17-alpine
    container_name: witw-postgres
    restart: unless-stopped
    labels:
      logging: enabled
      service: postgres
      env: prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-witw}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_BIND_HOST:?DB_BIND_HOST is required}:5432:5432"


  valkey:
    image: valkey/valkey:8-alpine
    container_name: witw-valkey
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: witw-backend
    restart: unless-stopped
    # Kafka metadata가 반환하는 외부 hostname을 BigData EC2 사설 IP로 해석한다.
    extra_hosts:
      - "j15d203a.p.ssafy.io:172.26.11.46"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRESQL_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-witw}
      POSTGRESQL_USER: ${POSTGRES_USER:-postgres}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-PASSWORD}
      VALKEY_HOST: valkey
      VALKEY_HOST_PORT: "6379"
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:?MAIL_APP_PASSWORD is required}
      SSAFY_CLIENT_ID: ${SSAFY_CLIENT_ID:?SSAFY_CLIENT_ID is required}
      SSAFY_CLIENT_SECRET: ${SSAFY_CLIENT_SECRET:?SSAFY_CLIENT_SECRET is required}
      SSAFY_REDIRECT_URI: ${SSAFY_REDIRECT_URI:?SSAFY_REDIRECT_URI is required}
      GMS_API_KEY: ${GMS_API_KEY:?GMS_API_KEY is required}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  postgres-data:

networks:
  default:
    name: ${APP_DOCKER_NETWORK:-witw-app-network}
    external: true
