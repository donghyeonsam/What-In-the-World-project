global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          env: prod

  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["witw-backend:9091"]
        labels:
          env: prod

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          env: prod
