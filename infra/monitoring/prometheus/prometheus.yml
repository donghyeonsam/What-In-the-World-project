global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["witw-backend-dev:9091"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
