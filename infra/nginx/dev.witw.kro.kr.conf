# EC2 host Nginx: enable AFTER issuing the dev certificate.
server {
    listen 80;
    server_name dev.witw.kro.kr;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-dev-witw;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://dev.witw.kro.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dev.witw.kro.kr;

    ssl_certificate /etc/nginx/ssl/dev-witw/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/dev-witw/dev.witw.kro.kr.key;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
