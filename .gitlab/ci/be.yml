validate-backend:
  stage: validate
  image: eclipse-temurin:21-jdk
  tags:
    - backend-ci
  timeout: 15m
  # privileged = false 정책이라 CI 에는 Docker 가 없다. Testcontainers 대신
  # 이 service 컨테이너를 TEST_* 로 넘겨 TestContainerSupport 가 쓰게 한다.
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: valkey/valkey:8-alpine
      alias: valkey
  variables:
    POSTGRES_DB: witw
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: test_password
    # POSTGRESQL_* 과 겹치지 않게 해 실 DB 오접속을 막는다.
    TEST_POSTGRESQL_URL: jdbc:postgresql://postgres:5432/witw
    TEST_POSTGRESQL_USER: postgres
    TEST_POSTGRESQL_PASSWORD: test_password
    TEST_VALKEY_HOST: valkey
    TEST_VALKEY_PORT: "6379"
  script:
    - cd "$CI_PROJECT_DIR/backend"
    - bash ./gradlew test --no-daemon
  rules:
    # 운영 환경변수 변경 후 New pipeline에서 master를 선택해 재배포할 수 있다.
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/docker-compose.dev.yml
        - backend/src/**/*
        - backend/gradle/**/*
        - backend/*.gradle
        - backend/gradle.properties
        - backend/gradlew
        - backend/Dockerfile
        - backend/.dockerignore
        - .gitlab-ci.yml
        - .gitlab/ci/be.yml
        - backend/docker-compose.prod.yml
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop")'
      changes:
        - backend/src/**/*
        - backend/gradle/**/*
        - backend/*.gradle
        - backend/gradle.properties
        - backend/gradlew
        - backend/Dockerfile
        - backend/.dockerignore
        - .gitlab-ci.yml
        - .gitlab/ci/be.yml
        - backend/docker-compose.prod.yml
        - backend/docker-compose.dev.yml

deploy-backend-dev:
  extends: deploy-backend
  resource_group: backend-development
  environment:
    name: development-backend
  variables:
    BACKEND_ENV_FILE: /opt/witw-backend-dev/.env
    BACKEND_COMPOSE_PROJECT: witw-backend-dev
    BACKEND_COMPOSE_FILE: docker-compose.dev.yml
    BACKEND_HOST_PORT: "8081"
    APP_DOCKER_NETWORK: witw-dev-network
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes:
        - backend/src/**/*
        - backend/gradle/**/*
        - backend/*.gradle
        - backend/gradle.properties
        - backend/gradlew
        - backend/Dockerfile
        - backend/.dockerignore
        - backend/docker-compose.dev.yml
        - .gitlab-ci.yml
        - .gitlab/ci/be.yml

deploy-backend:
  stage: deploy
  tags:
    - backend-deploy
  timeout: 20m
  needs:
    - validate-backend
  resource_group: backend-production
  interruptible: false
  environment:
    name: production-backend
  variables:
    BACKEND_ENV_FILE: /opt/witw-backend/.env
    BACKEND_COMPOSE_PROJECT: witw-backend-prod
    APP_DOCKER_NETWORK: witw-app-network
    BACKEND_COMPOSE_FILE: docker-compose.prod.yml
    BACKEND_HOST_PORT: "8080"
  script:
    - test -f "$BACKEND_ENV_FILE"
    - cd "$CI_PROJECT_DIR/backend"
    - docker compose --env-file "$BACKEND_ENV_FILE" -p "$BACKEND_COMPOSE_PROJECT" -f "$BACKEND_COMPOSE_FILE" config --quiet
    - docker network inspect "$APP_DOCKER_NETWORK" >/dev/null 2>&1 || docker network create "$APP_DOCKER_NETWORK"
    - docker compose --env-file "$BACKEND_ENV_FILE" -p "$BACKEND_COMPOSE_PROJECT" -f "$BACKEND_COMPOSE_FILE" up -d --build --wait --wait-timeout 180
    - docker compose --env-file "$BACKEND_ENV_FILE" -p "$BACKEND_COMPOSE_PROJECT" -f "$BACKEND_COMPOSE_FILE" ps
    - timeout 5 bash -c "</dev/tcp/127.0.0.1/$BACKEND_HOST_PORT"
  rules:
    # 수동 파이프라인에서도 검증 성공 후 운영 백엔드를 배포한다.
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
      changes:
        - backend/src/**/*
        - backend/gradle/**/*
        - backend/*.gradle
        - backend/gradle.properties
        - backend/gradlew
        - backend/Dockerfile
        - backend/.dockerignore
        - .gitlab-ci.yml
        - .gitlab/ci/be.yml
        - backend/docker-compose.prod.yml
