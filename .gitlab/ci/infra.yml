deploy-monitoring-prod:
  stage: deploy
  tags:
    - backend-deploy
  timeout: 20m
  needs:
    - job: deploy-backend
      optional: true
    - job: deploy-frontend
      optional: true
  resource_group: monitoring-production
  interruptible: false
  environment:
    name: production-monitoring
  variables:
    MONITORING_DEPLOY_DIR: /opt/witw-monitoring
    MONITORING_ENV_FILE: /opt/witw-monitoring/.env
    MONITORING_COMPOSE_PROJECT: witw-monitoring
  script:
    - test -f "$MONITORING_ENV_FILE"
    - install -d "$MONITORING_DEPLOY_DIR/alloy" "$MONITORING_DEPLOY_DIR/loki" "$MONITORING_DEPLOY_DIR/grafana/provisioning/datasources"
    - cp "$CI_PROJECT_DIR/infra/monitoring/docker-compose.yml" "$MONITORING_DEPLOY_DIR/docker-compose.yml"
    - cp "$CI_PROJECT_DIR/infra/monitoring/alloy/config.alloy" "$MONITORING_DEPLOY_DIR/alloy/config.alloy"
    - cp "$CI_PROJECT_DIR/infra/monitoring/loki/config.yml" "$MONITORING_DEPLOY_DIR/loki/config.yml"
    - cp "$CI_PROJECT_DIR/infra/monitoring/grafana/provisioning/datasources/loki.yml" "$MONITORING_DEPLOY_DIR/grafana/provisioning/datasources/loki.yml"
    - cp -R "$CI_PROJECT_DIR/infra/monitoring/prometheus" "$MONITORING_DEPLOY_DIR/"
    - cp -R "$CI_PROJECT_DIR/infra/monitoring/grafana/." "$MONITORING_DEPLOY_DIR/grafana/"
    - export BIGDATA_DASHBOARDS_PATH="$MONITORING_DEPLOY_DIR/grafana/bigdata"
    - install -d "$BIGDATA_DASHBOARDS_PATH"
    - cp "$CI_PROJECT_DIR/bigdata/monitoring/grafana/dashboards/"*.json "$BIGDATA_DASHBOARDS_PATH/"
    - cd "$MONITORING_DEPLOY_DIR"
    - docker compose --env-file "$MONITORING_ENV_FILE" -p "$MONITORING_COMPOSE_PROJECT" config --quiet
    - docker compose --env-file "$MONITORING_ENV_FILE" -p "$MONITORING_COMPOSE_PROJECT" pull
    - docker compose --env-file "$MONITORING_ENV_FILE" -p "$MONITORING_COMPOSE_PROJECT" run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
    - docker compose --env-file "$MONITORING_ENV_FILE" -p "$MONITORING_COMPOSE_PROJECT" run --rm --no-deps alloy validate /etc/alloy/config.alloy
    - docker compose --env-file "$MONITORING_ENV_FILE" -p "$MONITORING_COMPOSE_PROJECT" run --rm --no-deps loki -config.file=/etc/loki/config.yml -verify-config=true
    - docker compose --env-file "$MONITORING_ENV_FILE" -p "$MONITORING_COMPOSE_PROJECT" up -d --wait --wait-timeout 180
    # bind mount 설정 변경을 실행 중인 프로세스에도 반영한다.
    - docker compose --env-file "$MONITORING_ENV_FILE" -p "$MONITORING_COMPOSE_PROJECT" restart prometheus alloy
    - docker compose --env-file "$MONITORING_ENV_FILE" -p "$MONITORING_COMPOSE_PROJECT" ps
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
      changes:
        - infra/monitoring/**/*
        - bigdata/monitoring/grafana/dashboards/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/infra.yml
