# =========================================================
# ML (모델 증류) — Test 전용 (no-op)
#
# ml/ 은 서비스 런타임과 무관한 오프라인 증류 파이프라인이다.
# 빌드·배포 대상이 없고 CI 검증도 하지 않으므로, 이 job 은
# "ml/ 만 변경된 MR 에도 파이프라인이 생성되게" 하는 역할만 한다.
#
# ml/ 만 바뀐 MR 은 생성될 job 이 하나도 없어 GitLab 이 파이프라인
# 자체를 만들지 않았고, 그 탓에 "Pipelines must succeed" 조건이
# 충족되지 않아 머지가 막혔다. 이 job 이 그 구멍을 메운다.
#
# 나중에 실제 검증이 필요해지면 script 를 pytest 로 바꾸면 된다.
#   - pip install -r requirements-dev.txt
#   - pytest tests/ -v
# =========================================================
test-ml:
  stage: validate

  # frontend-ci 러너와 node:20-alpine 조합은 front.yml 에서 이미 쓰고 있다.
  # 검증된 러너 + 이미 받아둔 경량 이미지라 별도 러너 설정이 필요 없다.
  tags:
    - frontend-ci
  image: node:20-alpine

  timeout: 5m
  interruptible: true

  script:
    - echo "ml/ is an offline model-distillation pipeline — no CI validation required."

  rules:
    # develop / master 대상 MR
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ml/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/ml.yml

    # master / develop merge(push)
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop")'
      changes:
        - ml/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/ml.yml
