.bigdata-variables:
  variables:
    # GitLab Runner가 저장소 파일을 복사할 EC2의 고정 배포 경로
    BIGDATA_DEPLOY_DIR: /opt/news-bigdata
    BIGDATA_ENV_FILE: /opt/news-bigdata/.env

    # Runner의 체크아웃 경로와 관계없이 동일한 Compose 프로젝트를 관리
    COMPOSE_PROJECT_NAME: news-bigdata-prod
    COMPOSE_FILE: docker-compose.prod.yml
    MONITORING_COMPOSE_PROJECT_NAME: news-monitoring
    MONITORING_COMPOSE_FILE: monitoring/docker-compose.yml


# =========================================================
# Validate
# =========================================================
validate-bigdata:
  extends: .bigdata-variables
  stage: validate
  timeout: 15m

  variables:
    POSTGRESQL_URL: jdbc:postgresql://validation.invalid:5432/witw
    POSTGRESQL_USER: validation
    POSTGRESQL_PASSWORD: validation
    GMS_API_KEY: validation
    LOKI_URL: http://validation.invalid/loki/api/v1/push

  tags:
    - bigdata-deploy

  script:
    # -----------------------------------------------------
    # 기본 실행환경 확인
    # -----------------------------------------------------
    - command -v docker
    - docker compose version
    - command -v rsync

    - cd "$CI_PROJECT_DIR/bigdata"

    # -----------------------------------------------------
    # Docker Compose 문법 / 변수 치환 검사
    # 실제 Kafka 외부 접속은 하지 않으므로 임시 주소 사용
    # -----------------------------------------------------
    - KAFKA_EXTERNAL_HOST=validation.invalid KAFKA_BIND_HOST=127.0.0.1 docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" config --quiet
    - KAFKA_EXTERNAL_HOST=localhost KAFKA_BIND_HOST=127.0.0.1 docker compose -p news-bigdata-local -f docker-compose.local.yml config --quiet
    - docker compose -p "$MONITORING_COMPOSE_PROJECT_NAME" -f "$MONITORING_COMPOSE_FILE" config --quiet

    # -----------------------------------------------------
    # Kafka Topic 생성 스크립트 문법 검사
    # -----------------------------------------------------
    - bash -n kafka/scripts/create-topics.sh

    # -----------------------------------------------------
    # 애플리케이션 Docker 이미지 빌드 검증
    #
    # Kafka JMX agent, Collector 의존성, Java consumer 컴파일/테스트,
    # Spark Connector, HDFS exporter 이미지의 Dockerfile 및 COPY 경로 오류를 잡음
    # -----------------------------------------------------
    - KAFKA_EXTERNAL_HOST=validation.invalid KAFKA_BIND_HOST=127.0.0.1 docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" build kafka collector bronze-writer silver-writer spark-master
    - docker compose -p "$MONITORING_COMPOSE_PROJECT_NAME" -f "$MONITORING_COMPOSE_FILE" build hdfs-exporter
    - KAFKA_EXTERNAL_HOST=validation.invalid KAFKA_BIND_HOST=127.0.0.1 docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" run --rm --no-deps --entrypoint test spark-master -f /opt/spark/jars/org.apache.spark_spark-sql-kafka-0-10_2.13-4.2.0.jar
    - KAFKA_EXTERNAL_HOST=validation.invalid KAFKA_BIND_HOST=127.0.0.1 docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" run --rm --no-deps --entrypoint test spark-master -f /opt/spark/jars/org.postgresql_postgresql-42.7.7.jar
    - KAFKA_EXTERNAL_HOST=validation.invalid KAFKA_BIND_HOST=127.0.0.1 docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" run --rm --no-deps collector --help

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - bigdata/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/bigdata.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - bigdata/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/bigdata.yml


# =========================================================
# Deploy
# =========================================================
deploy-bigdata:
  extends: .bigdata-variables
  stage: deploy
  timeout: 30m

  tags:
    - bigdata-deploy

  needs:
    - validate-bigdata

  resource_group: bigdata-production
  interruptible: false

  environment:
    name: production-bigdata

  script:
    # -----------------------------------------------------
    # 필수 환경변수 / 배포경로 확인
    # -----------------------------------------------------
    - test -n "${KAFKA_EXTERNAL_HOST:-}"
    - test -n "${KAFKA_BIND_HOST:-}"
    - test "$KAFKA_BIND_HOST" != "0.0.0.0"
    - test "$KAFKA_BIND_HOST" != "::"
    - test "$KAFKA_BIND_HOST" != "[::]"
    - test -d "$BIGDATA_DEPLOY_DIR"
    - test -w "$BIGDATA_DEPLOY_DIR"
    - test -f "$BIGDATA_ENV_FILE"
    - test -r "$BIGDATA_ENV_FILE"

    # -----------------------------------------------------
    # GitLab Runner checkout → 운영 고정 경로 반영
    # -----------------------------------------------------
    - rsync -a --no-owner --no-group "$CI_PROJECT_DIR/bigdata/" "$BIGDATA_DEPLOY_DIR/"

    - cd "$BIGDATA_DEPLOY_DIR"

    # -----------------------------------------------------
    # 운영 Compose 최종 검증
    # -----------------------------------------------------
    - docker compose --env-file "$BIGDATA_ENV_FILE" -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" config --quiet

    # -----------------------------------------------------
    # 런타임에 그대로 사용하는 공식 이미지 업데이트
    #
    # Kafka, Collector, HDFS writer, Spark는 직접 build하는 서비스이므로 제외
    # -----------------------------------------------------
    - docker compose --env-file "$BIGDATA_ENV_FILE" -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" pull namenode datanode

    # -----------------------------------------------------
    # 애플리케이션 이미지 빌드
    #
    # JMX agent 내장 Kafka, Collector, Java Kafka-HDFS consumer,
    # Connector 내장 Spark 이미지 변경사항 반영
    # -----------------------------------------------------
    - docker compose --env-file "$BIGDATA_ENV_FILE" -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" build kafka collector bronze-writer silver-writer spark-master

    # -----------------------------------------------------
    # Collector를 제외한 기반 서비스 실행
    # -----------------------------------------------------
    - docker compose --env-file "$BIGDATA_ENV_FILE" -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" up -d --wait --wait-timeout 180 kafka namenode datanode spark-master spark-worker

    # -----------------------------------------------------
    # Kafka Topic 멱등 생성
    # -----------------------------------------------------
    - docker compose --env-file "$BIGDATA_ENV_FILE" -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" run --rm kafka-init

    # Spark checkpoint 경로를 HDFS에 멱등 생성
    - docker compose --env-file "$BIGDATA_ENV_FILE" -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" run --rm hdfs-checkpoint-init

    # Topic과 checkpoint 준비가 끝난 뒤 Collector, HDFS writer, Spark stream 시작
    - docker compose --env-file "$BIGDATA_ENV_FILE" -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" up -d --no-deps --wait --wait-timeout 900 collector bronze-writer silver-writer spark-enriched-stream spark-unclassified-issue-stream

    # -----------------------------------------------------
    # BigData Prometheus / Grafana / Exporter 배포
    # -----------------------------------------------------
    - docker compose --env-file "$BIGDATA_ENV_FILE" -p "$MONITORING_COMPOSE_PROJECT_NAME" -f "$MONITORING_COMPOSE_FILE" config --quiet
    - docker compose --env-file "$BIGDATA_ENV_FILE" -p "$MONITORING_COMPOSE_PROJECT_NAME" -f "$MONITORING_COMPOSE_FILE" pull alloy prometheus grafana kafka-exporter node-exporter
    - docker compose --env-file "$BIGDATA_ENV_FILE" -p "$MONITORING_COMPOSE_PROJECT_NAME" -f "$MONITORING_COMPOSE_FILE" build hdfs-exporter
    - docker compose --env-file "$BIGDATA_ENV_FILE" -p "$MONITORING_COMPOSE_PROJECT_NAME" -f "$MONITORING_COMPOSE_FILE" run --rm --no-deps alloy validate /etc/alloy/config.alloy
    - docker compose --env-file "$BIGDATA_ENV_FILE" -p "$MONITORING_COMPOSE_PROJECT_NAME" -f "$MONITORING_COMPOSE_FILE" up -d --wait --wait-timeout 180

    # -----------------------------------------------------
    # 배포 결과 확인
    # -----------------------------------------------------
    - docker compose --env-file "$BIGDATA_ENV_FILE" -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" ps
    - docker compose --env-file "$BIGDATA_ENV_FILE" -p "$MONITORING_COMPOSE_PROJECT_NAME" -f "$MONITORING_COMPOSE_FILE" ps

    # 애플리케이션 컨테이너 health 확인
    - test "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' news-collector)" = "healthy"
    - test "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' news-bronze-writer)" = "healthy"
    - test "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' news-silver-writer)" = "healthy"
    - test "$(docker inspect -f '{{.State.Running}}' news-spark-enriched-stream)" = "true"
    - test "$(docker inspect -f '{{.State.Running}}' news-spark-unclassified-issue-stream)" = "true"
    - test "$(docker inspect -f '{{.State.Running}}' news-prometheus)" = "true"
    - test "$(docker inspect -f '{{.State.Running}}' news-grafana)" = "true"
    - test "$(docker inspect -f '{{.State.Running}}' news-kafka-exporter)" = "true"
    - test "$(docker inspect -f '{{.State.Running}}' news-hdfs-exporter)" = "true"
    - test "$(docker inspect -f '{{.State.Running}}' news-alloy)" = "true"

    # 최근 Collector 로그 출력
    - docker logs --tail 50 news-collector
    - docker logs --tail 50 news-bronze-writer
    - docker logs --tail 50 news-silver-writer
    - docker logs --tail 50 news-spark-enriched-stream
    - docker logs --tail 50 news-spark-unclassified-issue-stream
    - docker logs --tail 50 news-prometheus
    - docker logs --tail 50 news-hdfs-exporter

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - bigdata/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/bigdata.yml
      when: manual
      allow_failure: true
