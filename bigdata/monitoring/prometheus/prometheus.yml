global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: witw-news

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: kafka-offsets
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: kafka-broker
    static_configs:
      - targets: ["kafka:7071"]

  - job_name: hdfs
    static_configs:
      - targets: ["hdfs-exporter:9120"]

  - job_name: spark-master
    metrics_path: /metrics/master/prometheus/
    static_configs:
      - targets: ["spark-master:8080"]

  - job_name: spark-worker
    metrics_path: /metrics/prometheus/
    static_configs:
      - targets: ["spark-worker:8081"]

  - job_name: spark-driver
    metrics_path: /metrics/prometheus/
    static_configs:
      - targets:
          - spark-enriched-stream:4040
          - spark-unclassified-issue-stream:4040

  - job_name: spark-streaming
    static_configs:
      - targets:
          - spark-enriched-stream:9102
          - spark-unclassified-issue-stream:9102
