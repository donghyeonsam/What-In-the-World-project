name: news-monitoring

services:
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: news-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.diskstats
    volumes:
      - /:/host:ro,rslave
    networks:
      - news-network

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: news-cadvisor
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    expose:
      - "8080"
    networks:
      - news-network

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: news-alloy
    restart: unless-stopped
    user: "0:0"
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      LOG_HOST: ${LOG_HOST:-bigdata}
      LOKI_URL: ${LOKI_URL:?LOKI_URL must be set}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: news-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_BIND_HOST:-172.26.11.46}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - news-network

  grafana:
    image: grafana/grafana:13.2.1
    container_name: news-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${MONITORING_BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - news-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: news-kafka-exporter
    restart: unless-stopped
    command:
      - --kafka.server=kafka:29092
      - --topic.filter=^news\..*
      - --group.filter=^(nlp-worker-v1|news-.*-hdfs-.*)$
    networks:
      - news-network

  hdfs-exporter:
    build:
      context: ./hdfs-exporter
      dockerfile: Dockerfile
    image: news-hdfs-exporter:1
    container_name: news-hdfs-exporter
    restart: unless-stopped
    environment:
      HDFS_NAMENODE_HTTP_URL: http://namenode:9870
      HDFS_DATANODE_HTTP_URL: http://datanode:9864
      HDFS_MONITORED_PATHS: ${HDFS_MONITORED_PATHS:-/data/news/silver/news.enriched.v1,/checkpoints}
    networks:
      - news-network

volumes:
  alloy-data:
  prometheus-data:
    name: news-prometheus-data
  grafana-data:
    name: news-grafana-data

networks:
  news-network:
    external: true
    name: news-network
