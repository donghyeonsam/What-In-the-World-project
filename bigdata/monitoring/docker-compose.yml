name: news-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: news-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "${MONITORING_BIND_HOST:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - news-network

  grafana:
    image: grafana/grafana:13.2.1
    container_name: news-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${MONITORING_BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - news-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: news-kafka-exporter
    restart: unless-stopped
    command:
      - --kafka.server=kafka:29092
      - --topic.filter=^news\..*
      - --group.filter=^(nlp-worker-v1|news-.*-hdfs-.*)$
      - --offset.show-all=true
    networks:
      - news-network

  hdfs-exporter:
    build:
      context: ./hdfs-exporter
      dockerfile: Dockerfile
    image: news-hdfs-exporter:1
    container_name: news-hdfs-exporter
    restart: unless-stopped
    environment:
      HDFS_NAMENODE_HTTP_URL: http://namenode:9870
      HDFS_DATANODE_HTTP_URL: http://datanode:9864
      HDFS_MONITORED_PATHS: ${HDFS_MONITORED_PATHS:-/data/news/bronze/news.raw.v1,/data/news/silver/news.enriched.v1,/checkpoints}
    networks:
      - news-network

volumes:
  prometheus-data:
    name: news-prometheus-data
  grafana-data:
    name: news-grafana-data

networks:
  news-network:
    external: true
    name: news-network
