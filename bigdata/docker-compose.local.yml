services:

  # =========================================================
  # Kafka
  # =========================================================
  kafka:
    # 사용할 Kafka Docker 이미지
    build:
      context: ./kafka
      dockerfile: Dockerfile
    image: news-kafka:4.3.1-monitored

    # Docker에서 보이는 컨테이너 이름
    container_name: news-kafka

    # Docker 네트워크 내부에서 사용할 hostname
    # 다른 컨테이너는 kafka:29092 로 접근 가능
    hostname: kafka

    # 컨테이너 내부 프로세스를 root 권한으로 실행
    user: root

    ports:
      # 내 PC(Host)의 19092 포트
      #        ↓
      # Kafka 컨테이너의 9092 포트
      #
      # 즉 로컬 PC의 프로그램에서는
      # localhost:19092 로 Kafka에 접근 가능
      - "127.0.0.1:19092:9092"

    environment:
      KAFKA_OPTS: "-javaagent:/opt/news-monitoring/jmx_prometheus_javaagent.jar=7071:/opt/news-monitoring/jmx-exporter.yml"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

      # ---------------------------------------------------------
      # KRaft 설정
      # ---------------------------------------------------------
      # Kafka 4.x에서는 ZooKeeper 없이
      # Kafka 자체가 메타데이터를 관리하는 KRaft 방식을 사용

      # 이 Kafka 노드의 고유 ID
      KAFKA_NODE_ID: 1

      # 이 Kafka 인스턴스가
      # broker + controller 역할을 동시에 수행
      #
      # broker:
      #   실제 메시지를 저장하고 Producer/Consumer 요청 처리
      #
      # controller:
      #   Kafka 클러스터의 메타데이터 관리
      #   (토픽, 파티션, 브로커 상태 등)
      KAFKA_PROCESS_ROLES: broker,controller


      # ---------------------------------------------------------
      # Listener 설정
      # ---------------------------------------------------------

      # Kafka가 실제로 열어둘 통신 포트
      #
      # INTERNAL   : Docker 내부 통신
      # EXTERNAL   : Docker 외부(내 PC 등) 통신
      # CONTROLLER : Kafka Controller 통신
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      # 클라이언트에게
      # "나한테 접속하려면 이 주소를 써"
      # 라고 알려주는 주소
      #
      # Docker 내부:
      #   kafka:29092
      #
      # Docker 외부:
      #   localhost:19092
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:19092"

      # 각각의 Listener에서 사용할 통신 방식
      #
      # 현재는 모두 PLAINTEXT
      # → SSL/TLS 인증 없이 통신
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      # Kafka 브로커끼리 통신할 때 INTERNAL Listener 사용
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Controller 통신에는 CONTROLLER Listener 사용
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # KRaft Controller 구성
      #
      # 형식:
      # 노드ID@호스트명:포트
      #
      # 현재 Controller는 1번 Kafka 하나뿐
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093


      # ---------------------------------------------------------
      # Single Broker 환경 설정
      # ---------------------------------------------------------
      # 현재 Kafka Broker가 1대뿐이기 때문에
      # Kafka 내부 토픽의 replication factor도 1로 설정해야 함

      # Consumer Group offset을 저장하는 내부 토픽의 복제 수
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # Transaction 정보를 저장하는 내부 토픽 복제 수
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      # Transaction 로그에서 필요한 최소 replica 수
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Consumer Group 생성 시 rebalance 대기시간
      # 로컬 개발환경에서는 바로 시작하도록 0ms
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # 토픽 자동 생성 비활성화
      # kafka-init에서 필요한 토픽을 명시적으로 생성
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    expose:
      - "7071"

    # Kafka 상태 확인
    healthcheck:
      test:
        - CMD-SHELL
        # CLI 자바 프로세스가 broker의 JMX agent 포트를 다시 열지 않도록 한다.
        - KAFKA_OPTS= /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - news-network

    volumes:
      # Kafka 데이터를 Docker Volume에 저장
      #
      # 컨테이너를 삭제했다가 다시 만들어도
      # Kafka 로그/메시지가 유지될 수 있음
      - kafka-data:/var/lib/kafka/data


  # =========================================================
  # Kafka Topic 초기화
  # =========================================================
  kafka-init:
    image: apache/kafka:4.3.1

    # 토픽 생성이 완료되면 종료되는 일회성 컨테이너
    restart: "no"

    # Kafka가 healthy 상태가 된 뒤 실행
    depends_on:
      kafka:
        condition: service_healthy

    # Kafka 토픽 생성 스크립트 실행
    entrypoint:
      - /bin/bash
      - /opt/news/scripts/create-topics.sh

    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:29092
      KAFKA_TOPICS_COMMAND: /opt/kafka/bin/kafka-topics.sh

    volumes:
      # 로컬의 토픽 생성 스크립트를 컨테이너에 연결
      - ./kafka/scripts/create-topics.sh:/opt/news/scripts/create-topics.sh:ro

    networks:
      - news-network


  # =========================================================
  # HDFS NameNode
  # =========================================================
  namenode:
    image: apache/hadoop:3.4.3

    container_name: news-hdfs-namenode

    # Docker 내부에서는 namenode라는 이름으로 접근 가능
    hostname: namenode

    user: root

    ports:
      # HDFS NameNode 웹 관리 화면
      #
      # 브라우저:
      # http://localhost:9870
      - "9870:9870"

      # HDFS Client가 NameNode와 통신하는 RPC 포트
      #
      # Host 환경에서는 localhost:9000
      # Docker 내부에서는 namenode:9000
      - "9000:9000"

    volumes:
      # NameNode 메타데이터 저장
      #
      # 어떤 파일이 있고,
      # 어떤 Block으로 나뉘었으며,
      # 어떤 DataNode에 저장되어 있는지 등의 정보
      - namenode-data:/data/name

      # 로컬에 작성한 Hadoop 설정 파일을
      # 컨테이너 내부 Hadoop 설정 경로에 연결
      #
      # :ro
      # → read-only
      # → 컨테이너가 파일을 수정하지 못하도록 설정
      - ./hadoop/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    command:
      - bash
      - -c
      - |
        if [ ! -d /data/name/current ]; then
          hdfs namenode -format -force -nonInteractive
        fi
        exec hdfs namenode

    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - news-network


  # =========================================================
  # HDFS DataNode
  # =========================================================
  datanode:
    image: apache/hadoop:3.4.3

    container_name: news-hdfs-datanode

    # Docker 내부에서는 datanode라는 이름으로 접근 가능
    hostname: datanode

    user: root

    ports:
      # DataNode 상태 확인 Web UI
      #
      # http://localhost:9864
      - "9864:9864"

    volumes:
      # 실제 HDFS 파일 Block 저장 위치
      #
      # NameNode는 파일의 "정보"를 저장하고
      # DataNode는 실제 데이터를 저장함
      - datanode-data:/data/data

      # NameNode와 동일한 Hadoop 설정 사용
      - ./hadoop/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    # DataNode 프로세스 실행
    command: hdfs datanode

    # NameNode가 정상 준비된 뒤 DataNode 실행
    depends_on:
      namenode:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report 2>/dev/null | grep -q 'Live datanodes (1)' "]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - news-network


  # =========================================================
  # Spark Checkpoint HDFS Directory Init
  # =========================================================
  hdfs-checkpoint-init:
    image: apache/hadoop:3.4.3
    container_name: news-hdfs-checkpoint-init
    user: root
    restart: "no"

    volumes:
      - ./hadoop/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    command:
      - bash
      - -c
      - |
        set -euo pipefail
        # Spark 프로세스는 spark 사용자로 실행되므로 체크포인트 경로만 쓰기 가능하게 준비한다.
        hdfs dfs -mkdir -p \
          /checkpoints/enriched-article-events-v1 \
          /checkpoints/unclassified-issue-stream-v1 \
          /checkpoints/unclassified-issue-state-v1
        hdfs dfs -chown -R spark:supergroup /checkpoints
        hdfs dfs -chmod -R 775 /checkpoints

    depends_on:
      datanode:
        condition: service_healthy

    networks:
      - news-network


  # =========================================================
  # Kafka(news.enriched.v1) -> HDFS silver writer
  # =========================================================
  silver-writer:
    build:
      context: ./kafka-hdfs-writer
      dockerfile: Dockerfile

    container_name: news-silver-writer
    restart: unless-stopped
    stop_grace_period: 60s

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: news.enriched.v1
      KAFKA_GROUP_ID: ${SILVER_WRITER_GROUP_ID:-news-enriched-hdfs-silver-v1}
      HDFS_URI: hdfs://namenode:9000
      HDFS_OUTPUT_PATH: ${SILVER_HDFS_PATH:-/data/news/silver/news.enriched.v1}
      HDFS_USER: root
      HADOOP_CONF_DIR: /opt/hadoop-conf
      HDFS_BATCH_MAX_BYTES: ${SILVER_HDFS_BATCH_MAX_BYTES:-67108864}
      HDFS_BATCH_MAX_RECORDS: ${SILVER_HDFS_BATCH_MAX_RECORDS:-50000}
      HDFS_BATCH_FLUSH_INTERVAL_SECONDS: ${SILVER_HDFS_BATCH_FLUSH_INTERVAL_SECONDS:-300}

    volumes:
      - ./hadoop/config:/opt/hadoop-conf:ro

    networks:
      - news-network


  # =========================================================
  # Spark Master
  # =========================================================
  spark-master:
    # Kafka Connector를 이미지 빌드 시점에 포함해 런타임 Maven 접근을 제거한다.
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: news-spark:4.2.0-kafka

    container_name: news-spark-master
    hostname: spark-master

    ports:
      # Spark Master Web UI
      - "8080:8080"

      # Spark Master 통신 포트
      - "7077:7077"

    environment:
      SPARK_LOCAL_HOSTNAME: spark-master
      HADOOP_CONF_DIR: /opt/hadoop-conf

    volumes:
      - ./hadoop/config:/opt/hadoop-conf:ro
      - ./spark/apps:/opt/spark/apps:ro
      - ./spark/conf/metrics.properties:/opt/spark/conf/metrics.properties:ro

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

    networks:
      - news-network


  # =========================================================
  # Spark Worker
  # =========================================================
  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: news-spark:4.2.0-kafka

    container_name: news-spark-worker
    hostname: spark-worker

    ports:
      # Spark Worker Web UI
      - "8081:8081"

    environment:
      SPARK_LOCAL_HOSTNAME: spark-worker
      HADOOP_CONF_DIR: /opt/hadoop-conf

    volumes:
      - ./hadoop/config:/opt/hadoop-conf:ro
      - ./spark/apps:/opt/spark/apps:ro
      - ./spark/conf/metrics.properties:/opt/spark/conf/metrics.properties:ro

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - "2g"
      - --webui-port
      - "8081"

    depends_on:
      - spark-master

    networks:
      - news-network


  # =========================================================
  # Enriched Article Spark Stream
  # =========================================================
  spark-enriched-stream:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: news-spark:4.2.0-kafka

    container_name: news-spark-enriched-stream
    restart: unless-stopped
    stop_grace_period: 60s

    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf
      SPARK_METRICS_HOST: 0.0.0.0
      SPARK_METRICS_PORT: "9102"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENRICHED_TOPIC: news.enriched.v1
      KAFKA_EVENT_TOPIC: news.event.v1
      KAFKA_UNCLASSIFIED_TOPIC: news.unclassified.v1
      # Spark는 Issue 후보를 조회만 하며 DB를 직접 수정하지 않는다.
      POSTGRESQL_URL: ${POSTGRESQL_URL:-jdbc:postgresql://host.docker.internal:5432/witw}
      POSTGRESQL_USER: ${POSTGRESQL_USER:-postgres}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:-1234}
      ISSUE_MATCH_THRESHOLD: ${ISSUE_MATCH_THRESHOLD:-0.85}
      SPARK_CHECKPOINT_LOCATION: ${SPARK_CHECKPOINT_LOCATION:-hdfs://namenode:9000/checkpoints/enriched-article-events-v1}
      SPARK_STARTING_OFFSETS: ${SPARK_STARTING_OFFSETS:-earliest}

    volumes:
      - ./hadoop/config:/opt/hadoop-conf:ro
      - ./spark/apps:/opt/spark/apps:ro
      - ./spark/conf/metrics.properties:/opt/spark/conf/metrics.properties:ro

    expose:
      - "4040"
      - "9102"

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.sql.shuffle.partitions=4
      - --conf
      - spark.default.parallelism=4
      - --conf
      - spark.ui.prometheus.enabled=true
      - --conf
      - spark.sql.streaming.metricsEnabled=true
      - --py-files
      - /opt/spark/apps/article_event.py,/opt/spark/apps/issue_matching.py,/opt/spark/apps/streaming_metrics.py
      - /opt/spark/apps/enriched_article_stream.py

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      hdfs-checkpoint-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started

    networks:
      - news-network


  # =========================================================
  # Unclassified Article -> Issue Clustering Spark Stream
  # =========================================================
  spark-unclassified-issue-stream:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: news-spark:4.2.0-kafka
    container_name: news-spark-unclassified-issue-stream
    restart: unless-stopped
    stop_grace_period: 60s

    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf
      SPARK_METRICS_HOST: 0.0.0.0
      SPARK_METRICS_PORT: "9102"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_UNCLASSIFIED_TOPIC: news.unclassified.v1
      KAFKA_EVENT_TOPIC: news.event.v1
      POSTGRESQL_URL: ${POSTGRESQL_URL:-jdbc:postgresql://host.docker.internal:5432/witw}
      POSTGRESQL_USER: ${POSTGRESQL_USER:-postgres}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:-1234}
      GMS_API_KEY: ${GMS_API_KEY:-}
      ISSUE_CLUSTER_MAX_ARTICLES_PER_THEME: ${ISSUE_CLUSTER_MAX_ARTICLES_PER_THEME:-2000}
      ISSUE_CLUSTER_CHECKPOINT_LOCATION: ${ISSUE_CLUSTER_CHECKPOINT_LOCATION:-hdfs://namenode:9000/checkpoints/unclassified-issue-stream-v1}
      ISSUE_CLUSTER_STATE_LOCATION: ${ISSUE_CLUSTER_STATE_LOCATION:-hdfs://namenode:9000/checkpoints/unclassified-issue-state-v1}
      ISSUE_CLUSTER_STARTING_OFFSETS: ${ISSUE_CLUSTER_STARTING_OFFSETS:-earliest}

    volumes:
      - ./hadoop/config:/opt/hadoop-conf:ro
      - ./spark/apps:/opt/spark/apps:ro
      - ./spark/conf/metrics.properties:/opt/spark/conf/metrics.properties:ro

    expose:
      - "4040"
      - "9102"

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.sql.shuffle.partitions=4
      - --conf
      - spark.default.parallelism=4
      - --conf
      - spark.ui.prometheus.enabled=true
      - --conf
      - spark.sql.streaming.metricsEnabled=true
      - --py-files
      - /opt/spark/apps/issue_clustering.py,/opt/spark/apps/gms_issue_generator.py,/opt/spark/apps/streaming_metrics.py
      - /opt/spark/apps/unclassified_issue_stream.py

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      hdfs-checkpoint-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started

    networks:
      - news-network

  # =========================================================
  # News Collector
  # =========================================================
  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile

    container_name: news-collector

    # 비정상 종료 시 자동 재시작
    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    environment:
      # Docker 내부 Kafka 주소
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      # 수집한 원본 기사를 저장할 Kafka 토픽
      KAFKA_RAW_TOPIC: news.raw.v1

      # Collector 상태 확인용 heartbeat 파일
      COLLECTOR_HEALTH_FILE: /data/collector/collector.heartbeat
      COLLECTOR_HEALTH_MAX_AGE_SECONDS: "180"

    command:
      - --registry
      - /app/registry.csv
      - --output-dir
      - /data/collector
      - --poll-seconds
      - "30"
      - --poll-workers
      - "5"
      - --fetch-workers
      - "5"
      - --timeout-seconds
      - "12"
      - --min-body-chars
      - "300"
      - --kafka-bootstrap
      - kafka:29092
      - --kafka-topic
      - news.raw.v1
      - --run-forever

    volumes:
      # Collector의 SQLite 및 결과 데이터 유지
      - collector-data:/data/collector

    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m

    networks:
      - news-network


  # =========================================================
  # NLP Worker
  # =========================================================
  nlp-worker:
    # nlp-worker 디렉토리의 Dockerfile을 사용하여 이미지 생성
    build:
      context: ./nlp-worker
      dockerfile: Dockerfile

    # Docker에서 보이는 컨테이너 이름
    container_name: news-nlp-worker

    # 비정상 종료 시 자동 재시작
    restart: unless-stopped

    # Kafka와 필요한 토픽 생성이 완료된 뒤 실행
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    environment:
      # Docker 내부에서는 Kafka 컨테이너 hostname으로 접근
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      # NLP Worker가 원본 뉴스를 읽을 Kafka 토픽
      KAFKA_RAW_TOPIC: news.raw.v1

      # NLP 처리 결과를 전송할 Kafka 토픽
      KAFKA_ENRICHED_TOPIC: news.enriched.v1

      # NLP Worker 전용 Consumer Group
      KAFKA_CONSUMER_GROUP: nlp-worker-v1

      # 한 번의 NLP 처리에서 가져올 기사 수
      NLP_BATCH_SIZE: "32"

    # Kafka와 동일한 Docker Network 사용
    #
    # 따라서 localhost가 아니라
    # kafka:29092 주소로 Kafka에 접근한다.
    networks:
      - news-network


# =========================================================
# Docker Volume
# =========================================================
#
# 컨테이너를 삭제해도 데이터를 유지하기 위한 저장공간
volumes:

  # Kafka 메시지/로그 저장
  kafka-data:

  # HDFS NameNode 메타데이터 저장
  namenode-data:

  # HDFS 실제 데이터 Block 저장
  datanode-data:

  # Collector SQLite 및 결과 데이터 저장
  collector-data:


# =========================================================
# Docker Network
# =========================================================
networks:

  # Kafka / Hadoop / Spark / Collector / NLP Worker가
  # 서로 hostname으로 통신하기 위한 공통 네트워크
  news-network:

    # Docker에 실제 생성되는 네트워크 이름을
    # news-network로 고정
    name: news-network
