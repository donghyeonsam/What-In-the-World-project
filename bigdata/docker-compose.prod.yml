name: news-bigdata-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  kafka:
    build:
      context: ./kafka
      dockerfile: Dockerfile
    image: news-kafka:4.3.1-monitored
    container_name: news-kafka
    hostname: kafka
    user: root
    restart: unless-stopped
    labels:
      logging: enabled
      service: kafka
      env: prod
    stop_grace_period: 30s

    ports:
      # GPU/NLP 서버에서 접근하는 Kafka 외부 포트
      - "${KAFKA_BIND_HOST:?KAFKA_BIND_HOST must be set}:19092:9092"

    environment:
      KAFKA_OPTS: "-javaagent:/opt/news-monitoring/jmx_prometheus_javaagent.jar=7071:/opt/news-monitoring/jmx-exporter.yml"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:?KAFKA_EXTERNAL_HOST must be set}:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    expose:
      - "7071"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      # 상시 검사는 새 JVM을 띄우지 않고 broker listener의 TCP 응답만 확인한다.
      # Kafka 프로토콜 readiness와 토픽 생성은 kafka-init에서 Java CLI로 검증한다.
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/29092"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
      start_interval: 5s

    logging: *default-logging
    networks:
      - news-network

  kafka-init:
    image: apache/kafka:4.3.1
    restart: "no"

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint:
      - /bin/bash
      - /opt/news/scripts/create-topics.sh

    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:29092
      KAFKA_TOPICS_COMMAND: /opt/kafka/bin/kafka-topics.sh

    volumes:
      - ./kafka/scripts/create-topics.sh:/opt/news/scripts/create-topics.sh:ro

    logging: *default-logging
    networks:
      - news-network

  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile

    container_name: news-collector
    restart: unless-stopped
    labels:
      logging: enabled
      service: collector
      env: prod
    stop_grace_period: 30s

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    environment:
      COLLECTOR_PROFILE: ${COLLECTOR_PROFILE:-legacy5}
      COLLECTOR_REGISTRY_PATH: ${COLLECTOR_REGISTRY_PATH:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_RAW_TOPIC: news.raw.v1
      COLLECTOR_HEALTH_FILE: /data/collector/collector.heartbeat
      COLLECTOR_HEALTH_MAX_AGE_SECONDS: "900"

    command:
      - --collection-profile
      - ${COLLECTOR_PROFILE:-legacy5}
      - --output-dir
      - /data/collector
      - --poll-seconds
      - "600"
      - --poll-workers
      - "20"
      - --fetch-workers
      - "16"
      - --timeout-seconds
      - "12"
      - --min-body-chars
      - "300"
      - --kafka-bootstrap
      - kafka:29092
      - --kafka-topic
      - news.raw.v1
      - --run-forever

    volumes:
      # SQLite state / output 유지
      - collector-data:/data/collector

    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m

    logging: *default-logging
    networks:
      - news-network

  collector-observe:
    profiles: ["observe"]
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: news-collector-observe
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      COLLECTOR_PROFILE: global47
      COLLECTOR_HEALTH_FILE: /data/collector/observe/collector.heartbeat
      COLLECTOR_HEALTH_MAX_AGE_SECONDS: "1800"
    command:
      - --observe-only
      - --collection-profile
      - global47
      - --output-dir
      - /data/collector
      - --poll-seconds
      - "600"
      - --poll-workers
      - "8"
      - --fetch-workers
      - "8"
      - --max-sources-per-country-per-round
      - "5"
      - --max-fetches-per-country-per-round
      - "10"
      - --max-fetches-per-source-per-round
      - "3"
      - --pending-max-age-minutes
      - "120"
      - --max-pending-per-source
      - "100"
      - --poll-error-quarantine-threshold
      - "6"
      - --poll-error-quarantine-minutes
      - "360"
      - --run-forever
    volumes:
      - collector-observe-data:/data/collector
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m
    logging: *default-logging
    networks:
      - news-network

  namenode:
    image: apache/hadoop:3.4.3
    container_name: news-hdfs-namenode
    hostname: namenode
    user: root
    restart: unless-stopped
    labels:
      logging: enabled
      service: namenode
      env: prod
    stop_grace_period: 30s

    ports:
      - "127.0.0.1:9870:9870"

    volumes:
      - namenode-data:/data/name
      - ./hadoop/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./hadoop/scripts/healthcheck.sh:/opt/news/healthcheck.sh:ro

    command:
      - bash
      - -c
      - |
        if [ ! -d /data/name/current ]; then
          hdfs namenode -format -force -nonInteractive
        fi
        exec hdfs namenode

    healthcheck:
      # NameNode JMX HTTP 응답을 확인하며 별도 Hadoop client JVM은 실행하지 않는다.
      test: ["CMD", "bash", "/opt/news/healthcheck.sh", "namenode"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
      start_interval: 5s

    logging: *default-logging
    networks:
      - news-network

  datanode:
    image: apache/hadoop:3.4.3
    container_name: news-hdfs-datanode
    hostname: datanode
    user: root
    restart: unless-stopped
    labels:
      logging: enabled
      service: datanode
      env: prod
    stop_grace_period: 30s

    ports:
      - "127.0.0.1:9864:9864"

    volumes:
      - datanode-data:/data/data
      - ./hadoop/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./hadoop/scripts/healthcheck.sh:/opt/news/healthcheck.sh:ro

    command: hdfs datanode

    depends_on:
      namenode:
        condition: service_healthy

    healthcheck:
      # 로컬 DataNode JMX와 NameNode가 보고하는 Live DataNode 수를 함께 확인한다.
      test: ["CMD", "bash", "/opt/news/healthcheck.sh", "datanode"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
      start_interval: 5s

    logging: *default-logging
    networks:
      - news-network

  hdfs-checkpoint-init:
    image: apache/hadoop:3.4.3
    container_name: news-hdfs-checkpoint-init
    user: root
    restart: "no"

    volumes:
      - ./hadoop/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    command:
      - bash
      - -c
      - |
        set -euo pipefail
        # 실행 중 생성·삭제되는 Spark 임시 경로와 경합하지 않도록 안정적인
        # 부모 경로만 준비하고, 버전별 하위 경로는 Spark가 직접 생성하게 한다.
        hdfs dfs -mkdir -p /checkpoints
        hdfs dfs -chown spark:supergroup /checkpoints
        hdfs dfs -chmod 775 /checkpoints

    depends_on:
      datanode:
        condition: service_healthy

    logging: *default-logging
    networks:
      - news-network

  silver-writer:
    build:
      context: ./kafka-hdfs-writer
      dockerfile: Dockerfile

    container_name: news-silver-writer
    restart: unless-stopped
    labels:
      logging: enabled
      service: silver-writer
      env: prod
    stop_grace_period: 60s

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: news.enriched.v1
      KAFKA_GROUP_ID: ${SILVER_WRITER_GROUP_ID:-news-enriched-hdfs-silver-v1}
      HDFS_URI: hdfs://namenode:9000
      HDFS_OUTPUT_PATH: ${SILVER_HDFS_PATH:-/data/news/silver/news.enriched.v1}
      HDFS_USER: root
      HADOOP_CONF_DIR: /opt/hadoop-conf
      HDFS_BATCH_MAX_BYTES: ${SILVER_HDFS_BATCH_MAX_BYTES:-67108864}
      HDFS_BATCH_MAX_RECORDS: ${SILVER_HDFS_BATCH_MAX_RECORDS:-50000}
      HDFS_BATCH_FLUSH_INTERVAL_SECONDS: ${SILVER_HDFS_BATCH_FLUSH_INTERVAL_SECONDS:-300}

    volumes:
      - ./hadoop/config:/opt/hadoop-conf:ro

    logging: *default-logging
    networks:
      - news-network

  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: news-spark:4.2.0-kafka
    container_name: news-spark-master
    hostname: spark-master
    restart: unless-stopped
    labels:
      logging: enabled
      service: spark-master
      env: prod
    stop_grace_period: 30s

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      SPARK_LOCAL_HOSTNAME: spark-master
      HADOOP_CONF_DIR: /opt/hadoop-conf

    volumes:
      - ./hadoop/config:/opt/hadoop-conf:ro
      - ./spark/apps:/opt/spark/apps:ro
      - ./spark/conf/metrics.properties:/opt/spark/conf/metrics.properties:ro

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import socket; s=socket.create_connection(('spark-master', 7077), 5); s.close()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    logging: *default-logging
    networks:
      - news-network

  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: news-spark:4.2.0-kafka
    container_name: news-spark-worker
    hostname: spark-worker
    restart: unless-stopped
    labels:
      logging: enabled
      service: spark-worker
      env: prod
    stop_grace_period: 30s

    ports:
      - "127.0.0.1:8081:8081"

    environment:
      SPARK_LOCAL_HOSTNAME: spark-worker
      HADOOP_CONF_DIR: /opt/hadoop-conf

    volumes:
      - ./hadoop/config:/opt/hadoop-conf:ro
      - ./spark/apps:/opt/spark/apps:ro
      - ./spark/conf/metrics.properties:/opt/spark/conf/metrics.properties:ro

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - "2g"
      - --webui-port
      - "8081"

    depends_on:
      spark-master:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import socket; s=socket.create_connection(('spark-worker', 8081), 5); s.close()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    logging: *default-logging
    networks:
      - news-network

  spark-enriched-stream:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: news-spark:4.2.0-kafka
    container_name: news-spark-enriched-stream
    restart: unless-stopped
    labels:
      logging: enabled
      service: spark-enriched-stream
      env: prod
    stop_grace_period: 60s

    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf
      SPARK_METRICS_HOST: 0.0.0.0
      SPARK_METRICS_PORT: "9102"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENRICHED_TOPIC: news.enriched.v1
      KAFKA_EVENT_TOPIC: news.event.v1
      KAFKA_UNCLASSIFIED_TOPIC: news.unclassified.v1
      # 운영 값은 /opt/news-bigdata/.env에서 읽으며 Spark는 Issue 조회 권한만 필요하다.
      POSTGRESQL_URL: ${POSTGRESQL_URL:?POSTGRESQL_URL must be set}
      POSTGRESQL_USER: ${POSTGRESQL_USER:?POSTGRESQL_USER must be set}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:?POSTGRESQL_PASSWORD must be set}
      ISSUE_MATCH_THRESHOLD: ${ISSUE_MATCH_THRESHOLD:-0.85}
      SPARK_CHECKPOINT_LOCATION: ${SPARK_CHECKPOINT_LOCATION:-hdfs://namenode:9000/checkpoints/enriched-article-events-v1}
      SPARK_STARTING_OFFSETS: ${SPARK_STARTING_OFFSETS:-earliest}

    volumes:
      - ./hadoop/config:/opt/hadoop-conf:ro
      - ./spark/apps:/opt/spark/apps:ro
      - ./spark/conf/metrics.properties:/opt/spark/conf/metrics.properties:ro

    expose:
      - "4040"
      - "9102"

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.sql.shuffle.partitions=4
      - --conf
      - spark.default.parallelism=4
      - --conf
      - spark.ui.prometheus.enabled=true
      - --conf
      - spark.sql.streaming.metricsEnabled=true
      - --py-files
      - /opt/spark/apps/article_event.py,/opt/spark/apps/issue_matching.py,/opt/spark/apps/streaming_metrics.py
      - /opt/spark/apps/enriched_article_stream.py

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      hdfs-checkpoint-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy

    logging: *default-logging
    networks:
      - news-network

  spark-unclassified-issue-stream:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: news-spark:4.2.0-kafka
    container_name: news-spark-unclassified-issue-stream
    restart: unless-stopped
    labels:
      logging: enabled
      service: spark-unclassified-issue-stream
      env: prod
    stop_grace_period: 60s

    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf
      SPARK_METRICS_HOST: 0.0.0.0
      SPARK_METRICS_PORT: "9102"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_UNCLASSIFIED_TOPIC: news.unclassified.v1
      KAFKA_EVENT_TOPIC: news.event.v1
      POSTGRESQL_URL: ${POSTGRESQL_URL:?POSTGRESQL_URL must be set}
      POSTGRESQL_USER: ${POSTGRESQL_USER:?POSTGRESQL_USER must be set}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:?POSTGRESQL_PASSWORD must be set}
      GMS_API_KEY: ${GMS_API_KEY:?GMS_API_KEY must be set}
      ISSUE_CLUSTER_MAX_ARTICLES_PER_THEME: ${ISSUE_CLUSTER_MAX_ARTICLES_PER_THEME:-2000}
      ISSUE_CLUSTER_CHECKPOINT_LOCATION: ${ISSUE_CLUSTER_CHECKPOINT_LOCATION:-hdfs://namenode:9000/checkpoints/unclassified-issue-stream-v1}
      ISSUE_CLUSTER_STATE_LOCATION: ${ISSUE_CLUSTER_STATE_LOCATION:-hdfs://namenode:9000/checkpoints/unclassified-issue-state-v1}
      ISSUE_CLUSTER_STARTING_OFFSETS: ${ISSUE_CLUSTER_STARTING_OFFSETS:-earliest}

    volumes:
      - ./hadoop/config:/opt/hadoop-conf:ro
      - ./spark/apps:/opt/spark/apps:ro
      - ./spark/conf/metrics.properties:/opt/spark/conf/metrics.properties:ro

    expose:
      - "4040"
      - "9102"

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.sql.shuffle.partitions=4
      - --conf
      - spark.default.parallelism=4
      - --conf
      - spark.ui.prometheus.enabled=true
      - --conf
      - spark.sql.streaming.metricsEnabled=true
      - --py-files
      - /opt/spark/apps/issue_clustering.py,/opt/spark/apps/gms_issue_generator.py,/opt/spark/apps/streaming_metrics.py
      - /opt/spark/apps/unclassified_issue_stream.py

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      hdfs-checkpoint-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy

    logging: *default-logging
    networks:
      - news-network
volumes:
  kafka-data:
    name: news-kafka-data

  collector-observe-data:
    name: news-collector-observe-data

  collector-data:
    name: news-collector-data

  namenode-data:
    name: news-namenode-data

  datanode-data:
    name: news-datanode-data

networks:
  news-network:
    name: news-network
